name: Publish @coffeemail/node

# Disparado por uma tag no formato node-v1.2.3 — ex.: depois de bumpar a
# versão em packages/node/package.json e commitar:
#   git tag node-v1.2.3 && git push origin node-v1.2.3
on:
  push:
    tags:
      - 'node-v*'

jobs:
  publish:
    name: Build, verify and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessário para provenance do npm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify tag matches package.json version
        working-directory: packages/node
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#node-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag node-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/node
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
